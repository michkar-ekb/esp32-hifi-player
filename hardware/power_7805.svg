<text x="1040" y="166" font-size="18" fill="#8b1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">+5 V</text>
<text x="1040" y="210" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">to the 5V pad</text>
<text x="1040" y="227" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">(ESP32-S3)</text>
<text x="24" y="440" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• C2 and C3 (ceramic) — right at the 7805 legs. / Керамика C2, C3 — вплотную к выводам кренки.</text>
<text x="24" y="466" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• Heatsink ~2×3 cm: 12 V → 5 V at ~0.3 A is about 2 W of heat. / Радиатор ~2×3 см: ~2 Вт тепла.</text>
<text x="24" y="492" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• Optional: 470 µF + 0.1 µF right at the ESP32 5V/GND pins. / По желанию: 470 мкФ + 0,1 мкФ у самого ESP32.</text>
<text x="24" y="518" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• GND of the 7805 goes to the same star point as the DAC. / Земля кренки — в ту же «звезду» у разъёма ЦАПа.</text>
